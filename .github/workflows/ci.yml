# Builds and tests the project on every push to main and on every pull request (GitHub Actions).
# Written once by `pisa init` because the architecture description has `pipeline { ci github }`; change it as you like,
# `pisa init --force` leaves it alone.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - run: mvn -B test
  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Playwright's browser and the system libraries it needs (the first run downloads them)
      - run: mvn -B -q exec:java -Dexec.mainClass=com.microsoft.playwright.CLI -Dexec.args="install --with-deps chromium" -Dexec.classpathScope=test
      - run: mvn -B test -Pui
