<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose a password</title>
  <link rel="stylesheet" href="webjars/bootstrap/5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="app.css">
</head>
<body class="login-page">
  <main class="container py-5" style="max-width: 30rem">
    <h1 class="h3 mb-4 text-center">Choose a password</h1>
    <p class="alert alert-info" id="first" hidden>This is your first sign-in: choose your own password. It is stored as a bcrypt hash only.</p>
    <p class="error alert alert-danger" id="error" hidden></p>
    <form class="card card-body shadow-sm d-grid gap-3" id="form" novalidate>
      <label id="currentLabel" hidden>Current password
        <input class="form-control" name="current" type="password" autocomplete="current-password">
        <span class="field-error text-danger small" id="current-error"></span>
      </label>
      <label>New password (at least 8 characters)
        <input class="form-control" name="password" type="password" autocomplete="new-password" required>
        <span class="field-error text-danger small" id="password-error"></span>
      </label>
      <label>New password again
        <input class="form-control" name="repeat" type="password" autocomplete="new-password" required>
        <span class="field-error text-danger small" id="repeat-error"></span>
      </label>
      <div class="buttons d-grid"><button type="submit" class="btn btn-primary">Save password</button></div>
    </form>
  </main>
  <script>
    const cookie = (name) => document.cookie.split("; ").find((c) => c.startsWith(name + "="))?.split("=")[1];
    const form = document.getElementById("form");
    const error = document.getElementById("error");
    fetch("api/me").then((r) => r.json()).then((me) => {
      document.getElementById("first").hidden = !me.mustChangePassword;
      document.getElementById("currentLabel").hidden = me.mustChangePassword;
    });
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      error.hidden = true;
      for (const field of ["current", "password", "repeat"]) document.getElementById(field + "-error").textContent = "";
      const data = Object.fromEntries(new FormData(form));
      const response = await fetch("api/password", {
        method: "POST",
        headers: { "Content-Type": "application/json", "X-XSRF-TOKEN": decodeURIComponent(cookie("XSRF-TOKEN") ?? "") },
        body: JSON.stringify(data),
      });
      if (response.ok) {
        location.href = "./";
        return;
      }
      const body = await response.json().catch(() => ({}));
      error.textContent = body.error ?? response.status + " " + response.statusText;
      error.hidden = false;
      for (const [field, message] of Object.entries(body.fields ?? {})) document.getElementById(field + "-error").textContent = message;
    });
  </script>
</body>
</html>
