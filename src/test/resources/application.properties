# Overrides application.yml for the tests. Every Spring context gets its own in-memory database (an empty
# url means: an embedded database with a unique name), and neither the H2 console nor the TCP server
# starts - the second context would find their port taken.
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.h2.console.enabled=false
h2.tcp.enabled=false

# The login: the tests sign in as the users of security-test.yml, and every Spring context keeps the passwords chosen in
# it in its own database (the table usr_password).
pisa.security.file=classpath:security-test.yml
